name: CI Pipeline

# Trigger the workflow on push and pull requests to main/actions branches
# Only when code files are modified (not docs, configs, etc.)
on:
  push:
    branches: [ main, actions ]
    paths:
      - '**.py'           # Python files
      - 'requirements*.txt' # Requirements files
      - 'Dockerfile'      # Docker configuration
      - 'docker-compose.yml'
      - 'Makefile'        # Build configuration
      - '.github/workflows/**' # Workflow changes
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/**'
  
  # Allow manual triggering of the workflow
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

env:
  # Docker registry configuration
  REGISTRY: docker.io  # Use Docker Hub
  IMAGE_NAME: rohan-rest-app
  
jobs:
  ci:
    name: Build, Test, and Deploy
    runs-on: self-hosted  # Use self-hosted runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # - name: Set up Python 3.13
    #   uses: actions/setup-python@v4
    #   with:
    #     python-version: '3.13'
        
    # - name: Cache Python dependencies
    #   uses: actions/cache@v3
    #   with:
    #     path: |
    #       ~/.cache/pip
    #       venv
    #     key: ${{ runner.os }}-python-3.13-${{ hashFiles('requirements*.txt') }}
    #     restore-keys: |
    #       ${{ runner.os }}-python-3.13-
    
    # Stage 1: Build API (Setup environment)
    - name: Build API - Setup Environment
      run: |
        echo "🏗️ Building API environment..."
        # Install system dependencies if needed
        make setup
      
    # Stage 2: Run Tests
    - name: Run Tests
      run: |
        echo "🧪 Running tests..."
        make test
        
    - name: Run Tests with Coverage
      run: |
        echo "📊 Running tests with coverage..."
        make test-cov
        
    # Stage 3: Perform Code Linting
    - name: Code Linting
      run: |
        echo "🔍 Performing code linting..."
        make lint
        
    - name: Code Formatting Check
      run: |
        echo "✨ Checking code formatting..."
        source venv/bin/activate
        black --check *.py tests/ || (echo "Code formatting check failed. Run 'make format' to fix." && exit 1)
    
    # Stage 4: Docker Login
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    
    # Alternative: Log in to GitHub Container Registry
    # - name: Log in to GitHub Container Registry
    #   uses: docker/login-action@v3
    #   with:
    #     registry: ghcr.io
    #     username: ${{ github.actor }}
    #     password: ${{ secrets.GITHUB_TOKEN }}
    
    # Stage 5: Docker Build and Push
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          GIT_COMMIT=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    # Alternative: Use make targets for Docker operations
    # - name: Docker Build using Make
    #   run: |
    #     echo "🐳 Building Docker image..."
    #     export REGISTRY=${{ env.REGISTRY }}/${{ secrets.DOCKER_HUB_USERNAME }}
    #     make docker-build
    #     
    # - name: Docker Push using Make
    #   run: |
    #     echo "📤 Pushing Docker image..."
    #     export REGISTRY=${{ env.REGISTRY }}/${{ secrets.DOCKER_HUB_USERNAME }}
    #     make docker-push
    
    - name: Post-build cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up..."
        docker system prune -f || true
        
    - name: Deployment Summary
      if: success()
      run: |
        echo "✅ CI Pipeline completed successfully!"
        echo "🏷️ Tags pushed: ${{ steps.meta.outputs.tags }}"
        echo "🚀 Image available at: ${{ env.REGISTRY }}/${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}"