---
# 1. SERVICE ACCOUNT - For ESO to authenticate with Vault
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: students-api
  labels:
    app: external-secrets

---
# 2. SECRET - Vault token for ESO authentication
# This will be populated after Vault initialization
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: students-api
type: Opaque
stringData:
  token: ""  # Will be populated after Vault setup

---
# 3. SECRETSTORE - Configure Vault as secret backend for students-api namespace
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: students-api
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Use Kubernetes auth method
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-vault"

---
# 4. EXTERNALSECRET - Sync database credentials from Vault to Kubernetes
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials-sync
  namespace: students-api
  labels:
    app: external-secrets
spec:
  # Refresh secrets every 1 hour
  refreshInterval: 1h
  
  # Reference to the SecretStore
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  
  # Target Kubernetes Secret to create/update
  target:
    name: db-credentials
    creationPolicy: Owner
  
  # Data to sync from Vault
  data:
  - secretKey: username
    remoteRef:
      key: database/students-api
      property: username
  
  - secretKey: password
    remoteRef:
      key: database/students-api
      property: password
